<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Majlis Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body, #root { height: 100%; margin: 0; }
  body { font-family: 'Inter', sans-serif; background:#122320; }
  .font-serif { font-family: 'Lora', serif; }
  ::selection { background: #C9A22755; }
  textarea:focus, input:focus, button:focus-visible { outline: 2px solid #C9A227; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #2F4A44; border-radius: 4px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

function StarDivider({ className }) {
  const stars = new Array(14).fill(0);
  return (
    <div className={"star-row " + (className || "")} style={{display:"flex", alignItems:"center", justifyContent:"center", gap:"12px", opacity:0.4}}>
      {stars.map((_, i) => (
        <svg key={i} width="9" height="9" viewBox="0 0 9 9">
          <path d="M4.5 0L5.6 2.4L8 1L6.6 3.4L9 4.5L6.6 5.6L8 8L5.6 6.6L4.5 9L3.4 6.6L1 8L2.4 5.6L0 4.5L2.4 3.4L1 1L3.4 2.4Z" fill="#C9A227" />
        </svg>
      ))}
    </div>
  );
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function fmtDate(ts) { return new Date(ts).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }); }

// Model output uses a plain-text, section-marker format instead of JSON, so that
// quotes, apostrophes, and Arabic text in the content can never break parsing —
// there's no escaping to get wrong.
function parseSynthesisResponse(raw) {
  const getSection = (startMarker, endMarker) => {
    const startIdx = raw.indexOf(startMarker);
    if (startIdx === -1) return "";
    const from = startIdx + startMarker.length;
    const endIdx = endMarker ? raw.indexOf(endMarker, from) : -1;
    return raw.slice(from, endIdx === -1 ? raw.length : endIdx).trim();
  };

  const title = getSection("@@TITLE@@", "@@SUMMARY@@");
  const summary = getSection("@@SUMMARY@@", "@@KEYPOINTS@@");
  const keyPointsRaw = getSection("@@KEYPOINTS@@", "@@QURAN@@");
  const keyPoints = keyPointsRaw
    .split("\n")
    .map((l) => l.replace(/^[\s\-•\d.]+/, "").trim())
    .filter((l) => l.length > 0 && !/^\(.*\)$/.test(l));

  const quranRaw = getSection("@@QURAN@@", "@@HADITH@@");
  const hadithRaw = getSection("@@HADITH@@", "@@END@@");

  function parseFields(block) {
    const fields = {};
    block.split("\n").forEach((line) => {
      const m = /^([A-Za-z]+):\s*(.*)$/.exec(line.trim());
      if (m) fields[m[1]] = m[2].trim();
    });
    return fields;
  }

  const quran = quranRaw
    .split("### VERSE")
    .map((b) => b.trim())
    .filter(Boolean)
    .map(parseFields)
    .filter((f) => f.Reference)
    .map((f) => {
      const v = { reference: f.Reference, text: f.Meaning || "", relevance: f.Relevance || "" };
      if (f.Arabic) v.arabic = f.Arabic;
      if (f.TafsirSunniSource || f.TafsirSunniSummary) {
        v.tafsirSunni = { source: f.TafsirSunniSource || "", summary: f.TafsirSunniSummary || "" };
      }
      if (f.TafsirShiaSource || f.TafsirShiaSummary) {
        v.tafsirShia = { source: f.TafsirShiaSource || "", summary: f.TafsirShiaSummary || "" };
      }
      return v;
    });

  const hadith = hadithRaw
    .split("### HADITH")
    .map((b) => b.trim())
    .filter(Boolean)
    .map(parseFields)
    .filter((f) => f.Reference)
    .map((f) => ({ reference: f.Reference, text: f.Meaning || "", relevance: f.Relevance || "" }));

  return { title, summary, keyPoints, quran, hadith };
}

const STORAGE_KEY = "majlis-notes-sessions";
const API_KEY_STORAGE = "majlis-notes-api-key";

function App() {
  const [sessions, setSessions] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [activeId, setActiveId] = useState(null);
  const [query, setQuery] = useState("");
  const [synthesizing, setSynthesizing] = useState(false);
  const [error, setError] = useState("");
  const [mobileShowList, setMobileShowList] = useState(true);
  const [apiKey, setApiKey] = useState("");
  const [showKeyModal, setShowKeyModal] = useState(false);
  const [followUp, setFollowUp] = useState("");
  const [asking, setAsking] = useState(false);
  const draftTimer = useRef(null);

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        setSessions(parsed);
        if (parsed.length) setActiveId(parsed[0].id);
      }
      const key = localStorage.getItem(API_KEY_STORAGE);
      if (key) setApiKey(key);
    } catch (e) {}
    setLoaded(true);
  }, []);

  useEffect(() => {
    if (!loaded) return;
    clearTimeout(draftTimer.current);
    draftTimer.current = setTimeout(() => {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions)); } catch (e) {}
    }, 400);
    return () => clearTimeout(draftTimer.current);
  }, [sessions, loaded]);

  const active = sessions.find((s) => s.id === activeId) || null;

  const filtered = useMemo(() => {
    if (!query.trim()) return sessions;
    const q = query.toLowerCase();
    return sessions.filter((s) => {
      const hay = [
        s.title, s.notes, s.synthesis && s.synthesis.summary,
        ...((s.synthesis && s.synthesis.keyPoints) || []),
        ...((s.synthesis && s.synthesis.quran) || []).map(v => `${v.reference} ${v.text} ${v.relevance}`),
        ...((s.synthesis && s.synthesis.hadith) || []).map(h => `${h.reference} ${h.text} ${h.relevance}`),
      ].filter(Boolean).join(" ").toLowerCase();
      return hay.includes(q);
    });
  }, [sessions, query]);

  function newSession() {
    const s = { id: uid(), title: "Untitled talk", createdAt: Date.now(), notes: "", synthesis: null };
    setSessions(prev => [s, ...prev]);
    setActiveId(s.id);
    setQuery("");
    setMobileShowList(false);
  }

  function updateActive(patch) {
    setSessions(prev => prev.map(s => s.id === activeId ? { ...s, ...patch } : s));
  }

  function updateSynthesis(patch) {
    setSessions(prev => prev.map(s => s.id === activeId ? { ...s, synthesis: { ...s.synthesis, ...patch } } : s));
  }

  function deleteSession(id) {
    setSessions(prev => prev.filter(s => s.id !== id));
    if (activeId === id) setActiveId(null);
  }

  function saveApiKey(key) {
    setApiKey(key);
    try { localStorage.setItem(API_KEY_STORAGE, key); } catch (e) {}
    setShowKeyModal(false);
  }

  async function synthesize() {
    if (!active || !active.notes.trim()) return;
    if (!apiKey) { setShowKeyModal(true); return; }
    setSynthesizing(true);
    setError("");
    try {
      const prompt = `You are helping a Muslim note-taker who typed rough, possibly fragmented notes while listening to an Islamic talk/lecture. Their raw notes:

"""
${active.notes}
"""

Respond using EXACTLY this plain-text template — no JSON, no markdown, no code fences, no commentary before or after it. Keep every field's value on a single line (no internal line breaks). If a field doesn't apply or you aren't confident of it, omit that specific line entirely, but always keep the section marker lines themselves exactly as shown.

@@TITLE@@
<a short descriptive title for this talk, max 8 words>
@@SUMMARY@@
<a tight 3-5 sentence synthesis of what the notes cover>
@@KEYPOINTS@@
- <key point 1>
- <key point 2>
(3-6 total short bullet points of the main takeaways)
@@QURAN@@
(zero to 3 blocks, only for verses clearly relevant to the notes — omit this whole section's content if none are clearly relevant. Each block starts with a line reading exactly "### VERSE":)
### VERSE
Reference: <Surah name and ayah number(s), e.g. Surah Al-Baqarah 2:153>
Arabic: <the Arabic text of the ayah in Uthmani script — only if you are confident of the exact wording, omit this line otherwise>
Meaning: <a brief paraphrase, not a direct quotation, of the verse's meaning>
Relevance: <one sentence on why it connects to these notes>
TafsirSunniSource: <name of a well-known Sunni tafsir, e.g. Tafsir Ibn Kathir, Tafsir al-Tabari, Tafsir al-Sa'di — omit this and the next line if you can't confidently name one relevant to this verse>
TafsirSunniSummary: <a brief paraphrased summary, 2-3 sentences, of that tafsir's explanation of this verse>
TafsirShiaSource: <name of a well-known Shia tafsir, e.g. Tafsir al-Mizan (Allamah Tabataba'i), Majma' al-Bayan (al-Tabarsi), Tafsir al-Qummi — omit this and the next line if you can't confidently name one relevant to this verse>
TafsirShiaSummary: <a brief paraphrased summary, 2-3 sentences, of that tafsir's explanation of this verse>
@@HADITH@@
(zero to 3 blocks, only for hadith clearly relevant to the notes. Each block starts with a line reading exactly "### HADITH":)
### HADITH
Reference: <collection and book/number if known, e.g. Sahih Muslim, Book of Faith — if unsure of the exact collection, describe the theme instead and write "collection uncertain — verify">
Meaning: <a brief paraphrase, not a direct quotation, of the hadith's meaning>
Relevance: <one sentence on why it connects to these notes>
@@END@@

Never invent a specific ayah number, Arabic wording, hadith reference, or tafsir source/summary you are not reasonably confident about — omit that line rather than guess. Paraphrase only — never output a verbatim verse-for-verse translation.`;

      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "content-type": "application/json",
          "x-api-key": apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1500,
          messages: [{ role: "user", content: prompt }],
        }),
      });
      const rawText = await response.text();
      let data;
      try { data = JSON.parse(rawText); } catch (e) { throw new Error("HTTP " + response.status + ": " + rawText.slice(0, 300)); }
      if (data.error) throw new Error((data.error.message || "API error") + " [HTTP " + response.status + "]");
      const text = (data.content || []).map(b => b.type === "text" ? b.text : "").join("").trim();
      const parsed = parseSynthesisResponse(text);
      if (!parsed.summary) throw new Error("Response was empty or unparseable: " + text.slice(0, 300));
      updateActive({
        title: parsed.title || active.title,
        synthesis: {
          summary: parsed.summary || "",
          keyPoints: parsed.keyPoints || [],
          quran: parsed.quran || [],
          hadith: parsed.hadith || [],
          synthesizedAt: Date.now(),
        },
      });
    } catch (e) {
      setError("Couldn't synthesize just now — " + e.message);
    } finally {
      setSynthesizing(false);
    }
  }

  async function askFollowUp() {
    if (!active || !active.synthesis || !followUp.trim()) return;
    if (!apiKey) { setShowKeyModal(true); return; }
    setAsking(true);
    setError("");
    try {
      const prompt = `You are helping refine a study summary of an Islamic talk. Here is the original raw notes:

"""
${active.notes}
"""

Here is the current summary so far:

"""
${active.synthesis.summary}
"""

The note-taker now has a follow-up question they'd like answered and added to the summary:
"${followUp}"

Answer in 2-4 concise sentences of plain text only — no markdown, no headers, no JSON. If a Qur'an verse or Hadith is genuinely relevant, you may reference it by name (e.g. "Surah Al-Isra"), but never invent a specific ayah/hadith number or collection you aren't confident about — describe the theme instead and note it should be verified. Write it so it reads naturally as an added paragraph to the existing summary.`;

      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "content-type": "application/json",
          "x-api-key": apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 500,
          messages: [{ role: "user", content: prompt }],
        }),
      });
      const rawText = await response.text();
      let data;
      try { data = JSON.parse(rawText); } catch (e) { throw new Error("HTTP " + response.status + ": " + rawText.slice(0, 300)); }
      if (data.error) throw new Error((data.error.message || "API error") + " [HTTP " + response.status + "]");
      const answer = (data.content || []).map(b => b.type === "text" ? b.text : "").join("").trim();
      const updatedSummary = [active.synthesis.summary, answer].filter(Boolean).join("\n\n");
      updateSynthesis({ summary: updatedSummary });
      setFollowUp("");
    } catch (e) {
      setError("Couldn't get an answer just now — " + e.message);
    } finally {
      setAsking(false);
    }
  }

  const s = styles;

  return (
    <div style={s.appRoot}>
      {showKeyModal && (
        <div style={s.modalOverlay} onClick={() => setShowKeyModal(false)}>
          <div style={s.modalBox} onClick={e => e.stopPropagation()}>
            <h2 className="font-serif" style={{marginTop:0}}>Add your Anthropic API key</h2>
            <p style={{fontSize:"13px", color:"#B7C7C2", lineHeight:1.5}}>
              This app calls Claude directly from your browser to synthesize notes. Your key is stored only in
              this browser's local storage and sent only to api.anthropic.com — never to any other server.
              Get a key at <a href="https://console.anthropic.com" target="_blank" rel="noreferrer" style={{color:"#C9A227"}}>console.anthropic.com</a>.
            </p>
            <input
              type="password"
              placeholder="sk-ant-..."
              defaultValue={apiKey}
              id="apiKeyInput"
              style={s.input}
            />
            <div style={{display:"flex", gap:"8px", marginTop:"12px"}}>
              <button style={s.primaryBtn} onClick={() => saveApiKey(document.getElementById("apiKeyInput").value.trim())}>Save key</button>
              <button style={s.ghostBtn} onClick={() => setShowKeyModal(false)}>Cancel</button>
            </div>
          </div>
        </div>
      )}

      <header style={s.header}>
        <div style={{display:"flex", alignItems:"center", gap:"8px"}}>
          <span style={{color:"#C9A227", fontSize:"18px"}}>☰</span>
          <h1 className="font-serif" style={{fontSize:"18px", margin:0, letterSpacing:"0.02em"}}>Majlis Notes</h1>
        </div>
        <div style={{display:"flex", gap:"8px"}}>
          <button style={s.ghostSmallBtn} onClick={() => setShowKeyModal(true)}>{apiKey ? "API key ✓" : "Set API key"}</button>
          <button style={s.primaryBtn} onClick={newSession}>+ New talk</button>
        </div>
      </header>

      <div style={s.body}>
        <aside style={{...s.sidebar, display: mobileShowList ? "flex" : "none"}} className="sidebar-desktop">
          <div style={{padding:"12px", borderBottom:"1px solid #2F4A44"}}>
            <input
              value={query}
              onChange={e => setQuery(e.target.value)}
              placeholder="Search your summaries…"
              style={s.input}
            />
          </div>
          <div style={{flex:1, overflowY:"auto"}}>
            {filtered.length === 0 && (
              <p style={{fontSize:"13px", color:"#7C9992", padding:"16px", textAlign:"center"}}>
                {sessions.length === 0 ? "No talks yet. Start one to take notes." : "Nothing matches that search."}
              </p>
            )}
            {filtered.map(sess => (
              <button
                key={sess.id}
                onClick={() => { setActiveId(sess.id); setMobileShowList(false); }}
                style={{...s.sessionRow, background: activeId === sess.id ? "#1B342D" : "transparent"}}
              >
                <div className="font-serif" style={{fontSize:"14px", color:"#EDE6D2", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{sess.title || "Untitled talk"}</div>
                <div style={{fontSize:"11px", color:"#7C9992", marginTop:"2px"}}>{fmtDate(sess.createdAt)}</div>
              </button>
            ))}
          </div>
        </aside>

        <main style={{...s.main, display: mobileShowList ? "none" : "flex"}} className="main-desktop">
          {!active ? (
            <div style={{flex:1, display:"flex", alignItems:"center", justifyContent:"center", color:"#7C9992", fontSize:"14px", padding:"24px", textAlign:"center"}}>
              Select a talk on the left, or start a new one to begin taking notes.
            </div>
          ) : (
            <React.Fragment>
              <div style={s.mainHeader}>
                <button className="mobile-back" onClick={() => setMobileShowList(true)} style={{background:"none", border:"none", color:"#7C9992", fontSize:"18px", cursor:"pointer"}}>‹</button>
                <input
                  value={active.title}
                  onChange={e => updateActive({ title: e.target.value })}
                  className="font-serif"
                  style={{fontSize:"17px", background:"transparent", border:"none", color:"#EDE6D2", flex:1, outline:"none"}}
                  placeholder="Untitled talk"
                />
                <button onClick={() => deleteSession(active.id)} style={{background:"none", border:"none", color:"#7C9992", cursor:"pointer", fontSize:"16px"}} aria-label="Delete this talk">✕</button>
              </div>

              <div style={{flex:1, overflowY:"auto", padding:"20px", display:"flex", flexDirection:"column", gap:"20px"}}>
                <div>
                  <label style={{fontSize:"11px", textTransform:"uppercase", letterSpacing:"0.06em", color:"#7C9992", marginBottom:"8px", display:"block"}}>Your notes</label>
                  <textarea
                    value={active.notes}
                    onChange={e => updateActive({ notes: e.target.value })}
                    placeholder="Type as you listen…"
                    rows={8}
                    style={s.textarea}
                  />
                </div>

                <button
                  onClick={synthesize}
                  disabled={synthesizing || !active.notes.trim()}
                  style={{...s.synthesizeBtn, opacity: (synthesizing || !active.notes.trim()) ? 0.4 : 1, cursor: (synthesizing || !active.notes.trim()) ? "not-allowed" : "pointer"}}
                >
                  {synthesizing ? "Synthesizing…" : active.synthesis ? "Re-synthesize" : "✦ Synthesize summary"}
                </button>

                {error && <p style={{fontSize:"13px", color:"#D97757"}}>{error}</p>}

                {active.synthesis && (
                  <div>
                    <StarDivider />
                    <div style={{marginTop:"20px", display:"flex", flexDirection:"column", gap:"22px"}}>
                      <section>
                        <h2 className="font-serif" style={s.sectionTitle}>Summary</h2>
                        <textarea
                          value={active.synthesis.summary}
                          onChange={e => updateSynthesis({ summary: e.target.value })}
                          rows={6}
                          style={{...s.textarea, fontSize:"14px", lineHeight:1.6}}
                        />
                      </section>

                      {active.synthesis.keyPoints && active.synthesis.keyPoints.length > 0 && (
                        <section>
                          <h2 className="font-serif" style={s.sectionTitle}>Key points</h2>
                          <ul style={{margin:0, padding:0, listStyle:"none", display:"flex", flexDirection:"column", gap:"6px"}}>
                            {active.synthesis.keyPoints.map((k, i) => (
                              <li key={i} style={{fontSize:"14px", display:"flex", gap:"8px", color:"rgba(237,230,210,0.9)"}}>
                                <span style={{color:"#C9A227"}}>•</span> {k}
                              </li>
                            ))}
                          </ul>
                        </section>
                      )}

                      {active.synthesis.quran && active.synthesis.quran.length > 0 && (
                        <section>
                          <h2 className="font-serif" style={s.sectionTitle}>Related Qur'an verses</h2>
                          <div style={{display:"flex", flexDirection:"column", gap:"10px"}}>
                            {active.synthesis.quran.map((v, i) => (
                              <div key={i} style={s.card}>
                                <div style={{fontSize:"14px", fontWeight:500, color:"#EDE6D2"}}>{v.reference}</div>
                                {v.arabic && (
                                  <p dir="rtl" lang="ar" style={{fontFamily:"'Amiri','Traditional Arabic',serif", fontSize:"20px", lineHeight:2, color:"#EDE6D2", margin:"8px 0 4px"}}>{v.arabic}</p>
                                )}
                                <p style={{fontSize:"13px", color:"rgba(237,230,210,0.8)", margin:"6px 0 0"}}>{v.text}</p>
                                <p style={{fontSize:"12px", color:"#7C9992", marginTop:"6px", fontStyle:"italic"}}>{v.relevance}</p>
                                {(v.tafsirSunni || v.tafsirShia) && (
                                  <div style={{marginTop:"10px", paddingTop:"10px", borderTop:"1px solid #1D3630", display:"flex", flexDirection:"column", gap:"8px"}}>
                                    {v.tafsirSunni && (
                                      <div>
                                        <div style={{fontSize:"12px", fontWeight:600, color:"#C9A227"}}>Sunni tafsir — {v.tafsirSunni.source}</div>
                                        <p style={{fontSize:"12px", color:"rgba(237,230,210,0.75)", marginTop:"2px"}}>{v.tafsirSunni.summary}</p>
                                      </div>
                                    )}
                                    {v.tafsirShia && (
                                      <div>
                                        <div style={{fontSize:"12px", fontWeight:600, color:"#C9A227"}}>Shia tafsir — {v.tafsirShia.source}</div>
                                        <p style={{fontSize:"12px", color:"rgba(237,230,210,0.75)", marginTop:"2px"}}>{v.tafsirShia.summary}</p>
                                      </div>
                                    )}
                                  </div>
                                )}
                              </div>
                            ))}
                          </div>
                        </section>
                      )}

                      {active.synthesis.hadith && active.synthesis.hadith.length > 0 && (
                        <section>
                          <h2 className="font-serif" style={s.sectionTitle}>Related Hadith</h2>
                          <div style={{display:"flex", flexDirection:"column", gap:"10px"}}>
                            {active.synthesis.hadith.map((h, i) => (
                              <div key={i} style={s.card}>
                                <div style={{fontSize:"14px", fontWeight:500, color:"#EDE6D2"}}>{h.reference}</div>
                                <p style={{fontSize:"13px", color:"rgba(237,230,210,0.8)", margin:"6px 0 0"}}>{h.text}</p>
                                <p style={{fontSize:"12px", color:"#7C9992", marginTop:"6px", fontStyle:"italic"}}>{h.relevance}</p>
                              </div>
                            ))}
                          </div>
                        </section>
                      )}

                      <p style={{fontSize:"11px", color:"#5E7A73", paddingTop:"10px", borderTop:"1px solid #1D3630"}}>
                        AI-generated content — Arabic wording, translations, and tafsir summaries can contain errors
                        or misattributions. Always verify against a trusted source (e.g. quran.com for the Arabic
                        and translations, altafsir.com or quranx.com for Sunni tafsir, al-islam.org for Shia tafsir)
                        before relying on or sharing them.
                      </p>

                      <div style={{paddingTop:"10px", borderTop:"1px solid #1D3630", display:"flex", flexDirection:"column", gap:"8px"}}>
                        <label style={{fontSize:"11px", textTransform:"uppercase", letterSpacing:"0.06em", color:"#7C9992"}}>Ask Claude to add to this summary</label>
                        <div style={{display:"flex", gap:"8px"}}>
                          <input
                            value={followUp}
                            onChange={e => setFollowUp(e.target.value)}
                            onKeyDown={e => e.key === "Enter" && askFollowUp()}
                            placeholder="e.g. What does the Qur'an say about sincerity of intention?"
                            style={{...s.input, flex:1}}
                          />
                          <button
                            onClick={askFollowUp}
                            disabled={asking || !followUp.trim()}
                            style={{...s.synthesizeBtn, opacity: (asking || !followUp.trim()) ? 0.4 : 1, cursor: (asking || !followUp.trim()) ? "not-allowed" : "pointer", padding:"8px 14px", fontSize:"13px"}}
                          >
                            {asking ? "Asking…" : "✦ Ask"}
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </React.Fragment>
          )}
        </main>
      </div>

      <style>{`
        @media (min-width: 768px) {
          .sidebar-desktop { display: flex !important; }
          .main-desktop { display: flex !important; }
          .mobile-back { display: none !important; }
        }
      `}</style>
    </div>
  );
}

</script>
